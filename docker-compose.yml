services:
  postgres:
    image: postgres:17-alpine
    container_name: team-project-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: interview_team_project
    ports:
      # Exposed so the app, `npx prisma migrate dev` and `npx prisma studio`
      # can all reach the database from your host on localhost:5432.
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d interview_team_project"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
